# STYLE GATE — the serial's laws, verified on every push.
#
# Armed 2026-10-11. This replaces tools/style_gate_ci_draft.yml, which was held
# back only because the PAT lacked `workflow` scope — not because of any problem
# with the checks themselves.
#
# HARDENED per the house template (fire-phoenix-workshop/.github/workflows/validate.yml):
#   - actions pinned to commit SHAs, not mutable tags
#   - permissions: contents: read  (least privilege)
#   - concurrency cancel-in-progress
#   - job timeout
#
# TRIGGER COVERS WHAT THE GATE READS. tools/style_gate.py reads BOTH chapters/
# (author editions) and manuscript/ (reader editions) — it fails when one is
# missing, unpublished, or stale against the other. The first draft of this
# workflow triggered on chapters/** only, so a push that changed the SHIPPED
# reader editions would never have run the gate that exists to compare them.
# A trigger that misses the text the gate reads is the scope law in a new place:
# manuscript/** is in both path lists, and so is this file, so the workflow
# validates itself on its own edits.
#
# READ-ONLY BY DESIGN. It runs the two checkers that only read.
# tools/run_all.py is deliberately NOT run here: it writes manuscript/ and
# docs/, so it is a local build command, not a CI check.
#
# WHAT THIS DOES AND DOES NOT VERIFY — read this before trusting the badge.
# It enforces, as hard failures: no sentence over 60 words · no "the way" tic ·
# no bare 「...」 panel lines in prose.
# It does NOT enforce: the dialogue floor, digits-in-prose, placeholder text, or
# marker discipline. The floor is MEASURED and printed per chapter, but is not
# currently part of the pass/fail condition. See the repo root file
# GATE_GAP_DIALOGUE_2026-10-11.md — a green badge here does NOT mean all seven
# hard gates from the kit's 09_AUDIT_LAW.md are satisfied.

name: style-gate

on:
  push:
    paths:
      - 'chapters/**'
      - 'manuscript/**'
      - 'tools/style_gate.py'
      - 'tools/check_panels.py'
      - 'tools/style_gate_exceptions.txt'
      - 'foundation/PANELS.md'
      - '.github/workflows/style-gate.yml'
  pull_request:
    paths:
      - 'chapters/**'
      - 'manuscript/**'
      - 'tools/style_gate.py'
      - 'tools/check_panels.py'
      - 'tools/style_gate_exceptions.txt'
      - 'foundation/PANELS.md'
      - '.github/workflows/style-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: style-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Style gate + panel ledger
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"

      - name: Style gate
        run: python3 tools/style_gate.py

      - name: Panel ledger in sync
        run: python3 tools/check_panels.py
