# GATES — the story's laws, verified on every push.
#
# Armed 2026-10-12, under the rollout that began with the Grey Wolf and the kit:
# two repos first, watched to green, then templated here one repo at a time.
#
# HARDENED per the house template:
#   - actions pinned to commit SHAs, not mutable tags
#   - permissions: contents: read  (least privilege)
#   - concurrency cancel-in-progress
#   - job timeout
#
# TRIGGER COVERS WHAT THE CHECKER READS. Every directory the checkers below open
# is in the path lists — a trigger that misses the text a gate reads is the
# scope law in a new place.
#
# WHAT THIS DOES AND DOES NOT VERIFY — read this before trusting the badge.
# It runs this repository's own three checkers: tools/style_gate.py (the voice law), tools/verify.py (the chapter gate) and tools/selftest.py (proof the gates have teeth). A green badge means those checks passed; it is not the
# kit's seven hard gates, and it does not judge prose quality.

name: gates

on:
  push:
    paths:
      - 'chapters/**'
      - 'tools/**'
      - 'foundation/**'
      - '.github/workflows/style-gate.yml'
  pull_request:
    paths:
      - 'chapters/**'
      - 'tools/**'
      - 'foundation/**'
      - '.github/workflows/style-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Voice law + verification + selftest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      # The tool's own contract, from its header: 0 clean · 1 failures ·
      # 2 warnings only. Exit 2 is the tool saying PASS with warnings, so it does
      # not fail the build; exit 1 (a real failure) still does.
      - name: Voice law and style gate
        run: python3 tools/style_gate.py chapters/*.md || [ $? -eq 2 ]

      - name: Chapter verification gate
        run: python3 tools/verify.py chapters

      - name: The gate's own selftest
        run: python3 tools/selftest.py
